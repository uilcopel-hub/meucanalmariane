<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu IPTV Player para TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 35%;
      height: 100%;
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h2 { margin-bottom: 12px; color: #38bdf8; font-size: 1.3rem; }

    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.btn-load {
      padding: 10px 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      outline: none;
    }

    button.btn-load:hover {
      background-color: #0369a1;
    }

    #channel-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    .channel-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 15px;
      margin-bottom: 8px;
      background-color: #334155;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      border: 2px solid transparent;
      outline: none;
    }

    .channel-item:focus, .channel-item:hover {
      background-color: #0284c7;
      border-color: #38bdf8;
    }

    #player-container {
      width: 65%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📺 IPTV Player</h2>
    
    <div class="input-box">
      <input type="text" id="m3u-url" placeholder="Cole o link M3U ou .m3u8 aqui..." />
      <button class="btn-load" onclick="customLoad()">Carregar</button>
    </div>

    <div id="channel-list">Cole um link de lista M3U ou um link direto de canal (.m3u8 / .ts) acima.</div>
  </div>

  <div id="player-container">
    <video id="video-player" controls autoplay></video>
  </div>

  <script>
    const DEFAULT_URL = "https://iptv-org.github.io/iptv/languages/por.m3u";
    
    const urlInput = document.getElementById("m3u-url");
    const channelListEl = document.getElementById("channel-list");
    const video = document.getElementById("video-player");
    let hls = new Hls();

    window.onload = () => {
      const savedUrl = localStorage.getItem("iptv_custom_url") || DEFAULT_URL;
      urlInput.value = savedUrl;
      processarUrl(savedUrl);
    };

    function customLoad() {
      const url = urlInput.value.trim();
      if (url) {
        localStorage.setItem("iptv_custom_url", url);
        processarUrl(url);
      } else {
        alert("Por favor, cole um link válido!");
      }
    }

    urlInput.addEventListener("keyup", (event) => {
      if (event.key === "Enter") {
        customLoad();
      }
    });

    function processarUrl(url) {
      // Se for um link direto de stream (.m3u8, .ts ou porta de stream)
      if (url.includes('.m3u8') || url.includes('.ts') || url.includes(':8000/') || url.includes('/live/')) {
        channelListEl.innerHTML = `<div class="channel-item" style="background-color: #0284c7;">▶️ Reproduzindo Stream Direto</div>`;
        playStream(url);
      } else {
        // Caso contrário, tenta baixar como lista M3U
        fetchAndParseM3U(url);
      }
    }

    async function fetchAndParseM3U(url) {
      channelListEl.innerText = "Carregando lista de canais...";
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Erro ao aceder à URL.");
        const text = await response.text();
        const channels = parseM3U(text);
        
        if (channels.length === 0) {
          channelListEl.innerText = "Nenhum canal encontrado.";
          return;
        }

        renderChannels(channels);
      } catch (err) {
        channelListEl.innerText = "Erro ao carregar a lista (Bloqueio CORS do navegador). Tente usar um link direto de canal (.m3u8).";
      }
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const channels = [];
      let currentName = "";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("#EXTINF:")) {
          const commaIndex = line.lastIndexOf(',');
          currentName = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Canal";
        } else if (line.startsWith("http")) {
          channels.push({ name: currentName, url: line });
        }
      }
      return channels;
    }

    function renderChannels(channels) {
      channelListEl.innerHTML = "";
      channels.forEach((ch, index) => {
        const btn = document.createElement("button");
        btn.className = "channel-item";
        btn.innerText = ch.name;
        btn.tabIndex = index + 2;
        btn.onclick = () => playStream(ch.url);
        channelListEl.appendChild(btn);
      });
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      } else {
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
