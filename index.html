<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IPTV Player</title>
  <link rel="stylesheet" href="style.css">
  <!-- Importando HLS.js para reprodução de streams .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- TELA INICIAL (Home) -->
  <div id="home-screen" class="screen">
    <div class="welcome-container">
      <div class="logo-box">📺 Smart IPTV Player</div>
      <h1>Bem-vindo ao seu Centro de Mídia</h1>
      <p>Gerencie e assista a canais, filmes e séries diretamente das listas públicas.</p>
      
      <div class="home-actions">
        <button class="btn-primary" onclick="entrarNaSecao('canais')">📺 Canais de TV</button>
        <button class="btn-primary" onclick="entrarNaSecao('filmes')">🎬 Filmes e Séries</button>
        <button class="btn-secondary" onclick="atualizarListasDoGithub()">🔄 Atualizar e Baixar Listas</button>
      </div>
      
      <div id="status-carregamento" class="status-msg">Carregando listas salvas...</div>
    </div>
  </div>

  <!-- TELA DO PLAYER E LISTAGEM -->
  <div id="player-screen" class="screen" style="display: none;">
    
    <!-- Barra Superior -->
    <header class="top-bar">
      <button class="btn-voltar" onclick="voltarParaHome()">⬅ Voltar ao Menu</button>
      <h2 id="titulo-secao-atual">Canais de TV</h2>
      <div class="search-box">
        <input type="text" id="input-busca" placeholder="Pesquisar canal ou filme..." oninput="filtrarCanais()">
      </div>
    </header>

    <!-- Layout Principal em 3 Colunas -->
    <div class="iptv-layout">
      
      <!-- Coluna Esquerda: Categorias -->
      <aside class="sidebar">
        <h3>Categorias</h3>
        <ul id="categories-list">
          <!-- Preenchido via JS -->
        </ul>
      </aside>

      <!-- Coluna Central: Grade de Conteúdo (Cards com Imagem) -->
      <main class="content-grid-container">
        <div id="content-grid" class="content-grid">
          <!-- Os cards de filmes/canais aparecem aqui -->
        </div>
      </main>

      <!-- Coluna Direita: Player de Vídeo -->
      <section class="player-panel">
        <div class="video-wrapper">
          <video id="video-player" controls autoplay></video>
        </div>
        <div class="now-playing-info">
          <h4 id="current-title">Selecione um canal ou filme</h4>
          <span id="current-group">Categoria: --</span>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
