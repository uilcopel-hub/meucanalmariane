<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu IPTV Player para TV</title>
  <!-- Biblioteca para reproduzir vídeos .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Menu Lateral de Canais */
    #sidebar {
      width: 35%;
      height: 100%;
      background-color: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    h2 { margin-bottom: 12px; color: #38bdf8; font-size: 1.3rem; }

    /* Área de Inserção de Link */
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.btn-load {
      padding: 10px 15px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      outline: none;
    }

    button.btn-load:hover, button.btn-load:focus {
      background-color: #0369a1;
    }

    /* Lista com Scroll */
    #channel-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    .channel-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 15px;
      margin-bottom: 8px;
      background-color: #334155;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      border: 2px solid transparent;
      outline: none;
    }

    /* Estilo de Destaque para Seleção via Controle Remoto ou Mouse */
    .channel-item:focus, .channel-item:hover {
      background-color: #0284c7;
      border-color: #38bdf8;
    }

    /* Área do Player de Vídeo */
    #player-container {
      width: 65%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Sidebar com Input + Lista -->
  <div id="sidebar">
    <h2>📺 Lista de Canais</h2>
    
    <!-- Formulário para colar o Link M3U -->
    <div class="input-box">
      <input type="text" id="m3u-url" placeholder="Cole o link M3U aqui..." />
      <button class="btn-load" id="btn-carregar" onclick="customLoad()">Carregar</button>
    </div>

    <div id="channel-list">Informe um link M3U acima e clique em carregar.</div>
  </div>

  <!-- Player de Vídeo -->
  <div id="player-container">
    <video id="video-player" controls autoplay></video>
  </div>

  <script>
    // URL Padrão caso o usuário não tenha salvo nenhuma
    const DEFAULT_URL = "https://iptv-org.github.io/iptv/languages/por.m3u";
    
    const urlInput = document.getElementById("m3u-url");
    const channelListEl = document.getElementById("channel-list");
    const video = document.getElementById("video-player");
    let hls = new Hls();

    // Carrega a URL salva no navegador ou a padrão ao abrir
    window.onload = () => {
      const savedUrl = localStorage.getItem("iptv_custom_url") || DEFAULT_URL;
      urlInput.value = savedUrl;
      fetchAndParseM3U(savedUrl);
    };

    // Função disparada ao clicar no botão Carregar
    function customLoad() {
      const url = urlInput.value.trim();
      if (url) {
        localStorage.setItem("iptv_custom_url", url); // Salva no cache do navegador
        fetchAndParseM3U(url);
      } else {
        alert("Por favor, cole um link M3U válido!");
      }
    }

    // Permite apertar Enter no campo de texto para carregar
    urlInput.addEventListener("keyup", (event) => {
      if (event.key === "Enter") {
        customLoad();
      }
    });

    // Faz o download e parse da lista M3U
    async function fetchAndParseM3U(url) {
      channelListEl.innerText = "Carregando lista de canais...";
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Não foi possível acessar a URL.");
        const text = await response.text();
        const channels = parseM3U(text);
        
        if (channels.length === 0) {
          channelListEl.innerText = "Nenhum canal encontrado nessa lista.";
          return;
        }

        renderChannels(channels);
      } catch (err) {
        channelListEl.innerText = "Erro ao carregar a lista. Verifique se o link está correto e permite acesso externo (CORS).";
      }
    }

    // Extrai Nomes e Links .m3u8 do texto do arquivo .m3u
    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const channels = [];
      let currentName = "";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("#EXTINF:")) {
          const commaIndex = line.lastIndexOf(',');
          currentName = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Canal sem nome";
        } else if (line.startsWith("http")) {
          channels.push({ name: currentName, url: line });
        }
      }
      return channels;
    }

    // Renderiza os botões na tela
    function renderChannels(channels) {
      channelListEl.innerHTML = "";
      
      channels.forEach((ch, index) => {
        const btn = document.createElement("button");
        btn.className = "channel-item";
        btn.innerText = ch.name;
        btn.tabIndex = index + 2; // Mantém navegação fluida via teclado/D-Pad

        btn.onclick = () => playStream(ch.url);
        
        btn.onkeydown = (e) => {
          if (e.key === "Enter") playStream(ch.url);
        };

        channelListEl.appendChild(btn);
      });
    }

    // Executa o vídeo usando HLS.js
    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy(); // Reseta player anterior
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
